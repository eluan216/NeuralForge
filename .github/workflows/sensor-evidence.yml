name: Real sensor evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-sensor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  participant-held-out:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc-13
      CXX: g++-13
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uci-har
          key: uci-har-240-c00b803081a5c797cd5e4b83700a9810b38d53d9d84e01917e090e1fdbc81031
      - name: Acquire official dataset and record checksum
        run: python python/sensor_benchmark.py --download-only --cache "$RUNNER_TEMP/uci-har"
      - name: Build native trainer and deployable shared library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DNEURALFORGE_BUILD_TESTS=OFF -DNEURALFORGE_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel 2
      - name: Install evaluation dependencies only
        run: |
          python -m pip install -r python/requirements-sensor.txt
          python -m pip install "torch==2.15.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify participant partition rules
        run: python -m unittest discover -s python -p test_sensor_protocol.py
      - name: Run fixed protocol and score the official test cohort
        run: |
          python python/sensor_benchmark.py --cache "$RUNNER_TEMP/uci-har" --trainer build/bin/neuralforge_train_dataset --library build/lib/libneuralforge.so --output artifacts/real-sensor
          git rev-parse HEAD > artifacts/real-sensor/source-commit.txt
          c++ --version > artifacts/real-sensor/compiler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-sensor-evidence
          path: artifacts/real-sensor/
          retention-days: 30

  native-arm64-deployment:
    needs: participant-held-out
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: real-sensor-evidence
          path: transferred-model/
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uci-har
          key: uci-har-240-c00b803081a5c797cd5e4b83700a9810b38d53d9d84e01917e090e1fdbc81031
      - name: Build the native ARM64 runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DNEURALFORGE_BUILD_TESTS=OFF -DNEURALFORGE_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel 2
          python -m pip install "numpy==2.5.4"
      - name: Verify x86-trained bundle on all official test examples
        run: python python/sensor_benchmark.py --cache "$RUNNER_TEMP/uci-har" --library build/lib/libneuralforge.so --verify-existing transferred-model --cross-output artifacts/arm64-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-sensor-arm64-parity
          path: artifacts/arm64-parity.json
